# /etc/nginx/sites-available/jewels.srichamundeshwaridevi.in
# Replace the subdomain if Nisar picks a different name. Get the certificate with:
#   sudo certbot --nginx -d jewels.srichamundeshwaridevi.in
server {
    listen 80;
    server_name jewels.srichamundeshwaridevi.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jewels.srichamundeshwaridevi.in;

    # ssl_certificate / ssl_certificate_key lines are added by certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 60m;          # up to 10 photos per upload

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
